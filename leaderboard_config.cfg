; Global online leaderboard (Supabase). See LEADERBOARD.md for the 5-minute setup.
; Leave url/key empty to keep scores on each player's own device instead.
;
; url = your project URL, e.g. "https://abcdefghijklmnop.supabase.co"
; key = the project's PUBLIC key ("publishable" sb_publishable_... or legacy "anon").
;       Never put the secret / service_role key here: this file ships inside the game.

[supabase]

url=""
key=""
table="scores"
